<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Outside, dev view</title>
<style>
  :root { color-scheme: dark; --ink: #e8edf5; --dim: #8a93a6; --accent: #3ee6c4; --panel: rgba(8, 12, 18, .78); }
  html, body { margin: 0; height: 100%; background: #05070b; color: var(--ink); font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  .panel { position: fixed; left: 12px; top: 12px; padding: 10px 12px; background: var(--panel); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; display: grid; gap: 6px; width: 300px; max-width: calc(100vw - 48px); }
  .panel.hide { display: none; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label { color: var(--dim); }
  input[type=range] { flex: 1; min-width: 120px; }
  select, input, button { font: inherit; color: var(--ink); background: #111723; border: 1px solid rgba(255,255,255,.16); border-radius: 5px; padding: 3px 6px; }
  button { cursor: pointer; }
  b { color: var(--accent); }
  #stats { color: var(--dim); white-space: pre; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="panel" id="panel">
  <div class="row"><b id="clock">00:00</b><input id="time" type="range" min="0" max="1439" step="1" value="1290"></div>
  <div class="row"><label>date</label><input id="date" type="date"><label>weather</label>
    <select id="weather"><option>clear</option><option>cloudy</option><option>rain</option><option>snow</option><option>fog</option></select></div>
  <div class="row"><label>quality</label><select id="quality"><option>low</option><option selected>medium</option><option>high</option></select>
    <label><input id="bloom" type="checkbox" checked> bloom</label><label><input id="fw" type="checkbox"> fireworks</label><label><input id="aur" type="checkbox"> aurora</label></div>
  <div class="row"><button data-view="0">ahead</button><button data-view="-40">left 40</button><button data-view="40">right 40</button><button data-view="balcony">balcony</button><button data-view="scope">scope</button><button data-view="ship">ship</button><button data-view="ferry">ferry</button><button data-view="plane">plane</button></div>
  <div id="stats"></div>
  <div class="row" style="color:var(--dim)">drag to look, wheel to zoom, h hides this</div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.36.4/build/index.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer, EffectPass, Pass, BloomEffect, VignetteEffect } from 'postprocessing';
import { makeOutside3d } from '../src/outside3d.js';
import { holidayAt, vanTime } from '../src/pure/calendar.js';
import { vanDate, parseClock, cruiseAt, ferryAt, floatplaneAt, makeVessel, EYE, WATER_Y } from '../src/pure/outside.js';

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const today = vanTime(new Date());
const pad = n => String(n).padStart(2, '0');
$('date').value = params.get('date') || `${today.y}-${pad(today.m)}-${pad(today.d)}`;
const startClock = parseClock(params.get('time'));
$('time').value = startClock ? startClock.h * 60 + startClock.min : today.h * 60 + today.min;
if (params.get('weather')) $('weather').value = params.get('weather');
if (params.get('q')) $('quality').value = params.get('q');
$('fw').checked = params.has('fireworks');
$('aur').checked = params.has('aurora');
// The page owns the clock, so the module's own ?time and ?date overrides are lifted off the URL.
params.delete('time'); params.delete('date');
history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : ''));

const renderer = new THREE.WebGLRenderer({ canvas: $('view'), powerPreference: 'high-performance', stencil: false });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.info.autoReset = false;
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));

// A stand-in loft: black walls round the 22 by 6.5 m north glass, mullions, the balcony and its rail.
const frame = new THREE.Scene();
const black = new THREE.MeshBasicMaterial({ color: 0x050608 }), grey = new THREE.MeshBasicMaterial({ color: 0x15171b }), floorM = new THREE.MeshBasicMaterial({ color: 0x1c140e });
const box = (x0, x1, y0, y1, z0, z1, m) => { const g = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), m); g.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); frame.add(g); };
box(-8, 0, -3, 10, -15.25, -14.95, black); box(22, 30, -3, 10, -15.25, -14.95, black); box(-8, 30, 6.5, 10, -15.25, -14.95, black);
box(-8, 30, -0.4, 0, -15.0, 12, floorM); box(-8, 30, 6.6, 6.8, -15.0, 12, black);
for (let k = 1; k < 8; k++) box(k * 2.75 - 0.03, k * 2.75 + 0.03, 0, 6.5, -15.12, -15.02, grey);
box(0, 22, 0, 0.08, -15.14, -15.0, grey);
box(3, 19, -0.35, 0, -18, -15.25, grey);
box(3, 19, 1.02, 1.06, -17.98, -17.92, black);
for (let x = 3; x <= 19.01; x += 2) box(x - 0.02, x + 0.02, 0, 1.04, -17.97, -17.93, black);

const cam = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 120);
cam.rotation.order = 'YXZ';
const look = { yaw: 0, pitch: 0.04, fov: 55, pos: new THREE.Vector3(11, 1.6, -14.5) };
function applyLook() {
  cam.position.copy(look.pos);
  cam.rotation.set(look.pitch, -look.yaw * Math.PI / 180, 0);
  cam.fov = look.fov; cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
}

let stamp = performance.now(), base = 0;
function setClock() {
  const [y, m, d] = $('date').value.split('-').map(Number), mins = +$('time').value;
  base = vanDate(y, m, d, Math.floor(mins / 60), mins % 60).getTime();
  stamp = performance.now();
  $('clock').textContent = pad(Math.floor(mins / 60)) + ':' + pad(mins % 60);
}
setClock();
const now = () => new Date(base + performance.now() - stamp);
const flag = (name, on) => { const p = new URLSearchParams(location.search); on ? p.set(name, '') : p.delete(name); history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : '')); };

const out = makeOutside3d({
  now,
  weather: () => $('weather').value,
  holiday: () => holidayAt(now()),
  quality: () => $('quality').value,
});

let outsideCalls = 0, outsideTris = 0, outsideMs = 0;
function drawScenes(target) {
  renderer.setRenderTarget(target);
  renderer.autoClear = false;
  renderer.clear();
  renderer.info.reset();
  const t0 = performance.now();
  renderer.render(out.scene, out.camera);
  outsideMs = performance.now() - t0;
  outsideCalls = renderer.info.render.calls; outsideTris = renderer.info.render.triangles + renderer.info.render.points;
  renderer.clearDepth();
  renderer.render(frame, cam);
}
class BackgroundPass extends Pass {
  constructor() { super('BackgroundPass'); this.needsSwap = false; }
  render(r, inputBuffer) { drawScenes(this.renderToScreen ? null : inputBuffer); }
}
const composer = new EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType });
composer.addPass(new BackgroundPass());
composer.addPass(new EffectPass(cam, new BloomEffect({ luminanceThreshold: 0.82, luminanceSmoothing: 0.25, intensity: 1.15, mipmapBlur: true, radius: 0.72 }), new VignetteEffect({ offset: 0.32, darkness: 0.55 })));

function resize() { renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight); applyLook(); }
addEventListener('resize', resize);
resize();

const VIEWS = {
  0: { yaw: 0, pitch: 0.04, fov: 55, pos: [11, 1.6, -14.5] }, '-40': { yaw: -40, pitch: 0.04, fov: 55, pos: [11, 1.6, -14.5] }, 40: { yaw: 40, pitch: 0.04, fov: 55, pos: [11, 1.6, -14.5] },
  balcony: { yaw: -10, pitch: -0.35, fov: 55, pos: [11, 1.6, -17.6] },
};
// The scope keeps the Death Star centred, the way a telescope on a mount would.
function aimScope() {
  const d = out.deathStar;
  look.yaw = Math.atan2(d.x, -d.z) * 180 / Math.PI; look.pitch = Math.asin(d.y);
  applyLook();
}
// Vessel views follow the same timetables the module uses.
const FOLLOW = { ship: cruiseAt, ferry: ferryAt, plane: floatplaneAt }, vessel = makeVessel();
function aimVessel() {
  FOLLOW[look.follow](now().getTime() / 1000, vessel);
  if (!vessel.on) return;
  const dx = EYE[0] + vessel.dx - look.pos.x, dz = EYE[2] - vessel.dn - look.pos.z, dy = WATER_Y + (vessel.alt || 0) + 10 - look.pos.y;
  look.yaw = Math.atan2(dx, -dz) * 180 / Math.PI; look.pitch = Math.atan2(dy, Math.hypot(dx, dz));
  applyLook();
}
function setView(v) {
  look.follow = FOLLOW[v] ? v : null;
  if (look.follow) { look.track = false; look.fov = v === 'plane' ? 6 : 9; look.pos.set(12.4, 1.6, -14.5); aimVessel(); return; }
  look.track = v === 'scope';
  if (look.track) { look.fov = 4; look.pos.set(11, 1.6, -14.5); aimScope(); }
  else Object.assign(look, VIEWS[v], { pos: new THREE.Vector3(...VIEWS[v].pos) });
  applyLook();
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
$('time').oninput = setClock; $('date').onchange = setClock;
$('fw').onchange = () => flag('fireworks', $('fw').checked);
$('aur').onchange = () => flag('aurora', $('aur').checked);
addEventListener('keydown', e => { if (e.key === 'h') $('panel').classList.toggle('hide'); });

let drag = null;
$('view').addEventListener('pointerdown', e => { look.track = false; look.follow = null; drag = { x: e.clientX, y: e.clientY }; $('view').setPointerCapture(e.pointerId); });
$('view').addEventListener('pointermove', e => {
  if (!drag) return;
  const k = look.fov / innerHeight;
  look.yaw -= (e.clientX - drag.x) * k; look.pitch = Math.max(-1.4, Math.min(1.4, look.pitch + (e.clientY - drag.y) * k * Math.PI / 180));
  drag = { x: e.clientX, y: e.clientY }; applyLook();
});
addEventListener('pointerup', () => { drag = null; });
$('view').addEventListener('wheel', e => { look.fov = Math.max(1.5, Math.min(75, look.fov * Math.exp(e.deltaY * 0.001))); applyLook(); e.preventDefault(); }, { passive: false });

const frames = [], probes = [], ticks = [];
let last = performance.now(), t = 0, stopped = false;
function loop() {
  const n = performance.now(), dt = (n - last) / 1000;
  last = n; t += dt;
  frames.push(dt); if (frames.length > 90) frames.shift();
  if (look.track) aimScope();
  if (look.follow) aimVessel();
  const tk = performance.now();
  out.tick(dt, t, cam);
  ticks.push(performance.now() - tk); if (ticks.length > 300) ticks.shift();
  if ($('bloom').checked) composer.render(dt); else drawScenes(null);
  if (probes.length) {
    const c = document.createElement('canvas'), v = $('view');
    c.width = v.width; c.height = v.height;
    const x = c.getContext('2d');
    x.drawImage(v, 0, 0);
    for (const p of probes.splice(0)) p.done(Array.from(x.getImageData(Math.round(p.x * v.width / innerWidth), Math.round(p.y * v.height / innerHeight), 1, 1).data.slice(0, 3)));
  }
  if (frames.length % 15 === 0 || frames.length < 90) {
    const avg = frames.reduce((a, b) => a + b, 0) / frames.length;
    $('stats').textContent = `fps ${(1 / avg).toFixed(0)}  outside: ${outsideCalls} calls, ${(outsideTris / 1000).toFixed(0)}k prims\n` +
      `dayK ${out.light.dayK.toFixed(2)}  phase ${out.light.phase}  sun ${(Math.asin(out.light.sunDir.y) * 180 / Math.PI).toFixed(1)} deg`;
  }
  if (!stopped) requestAnimationFrame(loop);
}
loop();

// Hooks for scripted checks.
window.__dev = {
  set(o) {
    if (o.minutes != null) $('time').value = o.minutes;
    if (o.date) $('date').value = o.date;
    if (o.weather) $('weather').value = o.weather;
    if (o.quality) $('quality').value = o.quality;
    if (o.bloom != null) $('bloom').checked = o.bloom;
    if (o.fireworks != null) { $('fw').checked = o.fireworks; flag('fireworks', o.fireworks); }
    if (o.aurora != null) { $('aur').checked = o.aurora; flag('aurora', o.aurora); }
    if (o.view != null) setView(o.view);
    if (o.yaw != null) { look.track = false; look.follow = null; look.yaw = o.yaw; look.pitch = o.pitch ?? look.pitch; look.fov = o.fov ?? look.fov; if (o.pos) look.pos.set(...o.pos); applyLook(); }
    if (o.panel != null) $('panel').classList.toggle('hide', !o.panel);
    setClock();
  },
  stats() {
    const avg = frames.reduce((a, b) => a + b, 0) / frames.length;
    const gl = renderer.getContext(), ext = gl.getExtension('WEBGL_debug_renderer_info');
    return { gpu: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : '?', tickMs: ticks.reduce((a, b) => a + b, 0) / ticks.length, fps: 1 / avg, calls: outsideCalls, prims: outsideTris, outsideMs, dayK: out.light.dayK, phase: out.light.phase, deathStar: out.deathStar.toArray() };
  },
  probe: (x, y) => new Promise(done => probes.push({ x, y, done })),
  stop() { stopped = true; },
  renderer,
  out,
};
</script>
</body>
</html>
