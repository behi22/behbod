<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Range Robots Bench</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #101317; color: #e8e6e1; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .bar { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  button { background: #222831; color: #e8e6e1; border: 1px solid #3a4250; border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
  button.on { border-color: #5fe3d0; color: #5fe3d0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar" id="bar"></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
// The range's robots on their own: a walker striding on the spot and a drone hovering, turned slowly so every side
// can be seen, with buttons for what happens to them in a run. Drag to turn the view; the wheel zooms.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { makeFoeKit, poseWalker, hurtWalker, poseDrone, hurtDrone, chargeDrone, calmDrone } from '../src/range/foes.js';

const params = new URLSearchParams(location.search), low = params.has('low');
const canvas = document.getElementById('c'), renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(), pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.background = new THREE.Color(0x14181e);
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 50);
scene.add(new THREE.HemisphereLight(0xcfe2ff, 0x14161c, 0.9));
const key = new THREE.DirectionalLight(0xdfeaff, 2.2); key.position.set(1, 3, 2); scene.add(key);
const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x3a3f47, roughness: 0.8 }));
scene.add(floor);

const kit = makeFoeKit({ low });
const walker = kit.walker(), drone = kit.drone();
walker.reset(); drone.reset();
walker.g.position.set(-0.7, 0, 0); drone.g.position.set(0.8, 1.6, 0);
scene.add(walker.g, drone.g);
const frame = { dt: 0, t: 0, home: new THREE.Vector3(0.8, 1.6, 0), smoke: () => {} };
let walking = true, spin = true, stride = 0, age = 10, turn = 0.6, tilt = 0.18, dist = 5.2;
let walkerLeft = 1, droneLeft = 1;

const bar = document.getElementById('bar');
const button = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => fn(b); bar.append(b); return b; };
button('Walk', b => { walking = !walking; b.classList.toggle('on', walking); }).classList.add('on');
button('Turn', b => { spin = !spin; b.classList.toggle('on', spin); }).classList.add('on');
button('Walker: hit body', () => { walkerLeft *= 0.8; hurtWalker(walker, 'body', walkerLeft); });
button('Walker: hit core', () => { walkerLeft *= 0.6; hurtWalker(walker, 'core', walkerLeft); });
button('Walker: hit head', () => { walkerLeft *= 0.7; hurtWalker(walker, 'head', walkerLeft); });
button('Walker: look', () => { walker.glance = 0; });
button('Drone: hit', () => { droneLeft *= 0.7; hurtDrone(drone, 'body', droneLeft); });
button('Drone: charge', () => { chargeDrone(drone, age, 1); setTimeout(() => calmDrone(drone, true), 1000); });
button('Mend', () => { walker.reset(); drone.reset(); walkerLeft = droneLeft = 1; });
button('Close up: walker', () => { look.copy(walker.g.position).setY(1.05); dist = 3.8; });
button('Close up: drone', () => { look.copy(drone.g.position); dist = 1.8; });
button('Both', () => { look.set(0, 1.05, 0); dist = 5.2; });
const look = new THREE.Vector3(0, 1.05, 0);

let drag = null;
canvas.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', e => { if (!drag) return; turn -= (e.clientX - drag[0]) * 0.01; tilt = Math.max(-0.3, Math.min(1.2, tilt + (e.clientY - drag[1]) * 0.01)); drag = [e.clientX, e.clientY]; });
addEventListener('wheel', e => { dist = Math.max(1, Math.min(12, dist * (1 + Math.sign(e.deltaY) * 0.1))); });
const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
addEventListener('resize', resize); resize();

// For the checks: set the view and the clock by hand.
window.__bench = { walker, drone, kit, set(o) { Object.assign(view, o); }, renderer };
const view = { auto: true };
let last = performance.now(), t = 0;
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  if (view.auto && spin) turn += dt * 0.25;
  frame.dt = dt; frame.t = t;
  if (walking) stride += dt * 1.2;
  poseWalker(walker, { x: 0, d: 0, h: 0, heading: 1 }, stride, frame);
  age += dt;
  poseDrone(drone, frame.home, { ph: 1 }, age, frame);
  camera.position.set(look.x + Math.sin(turn) * Math.cos(tilt) * dist, look.y + Math.sin(tilt) * dist, look.z + Math.cos(turn) * Math.cos(tilt) * dist);
  camera.lookAt(look);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
