<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loft games</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: radial-gradient(ellipse at 50% 30%, #13202e 0%, #05070b 70%); color: #e8edf5; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 14px; letter-spacing: .3em; color: #3ee6c4; margin: 0 0 8px; }
  p { color: #8a93a6; font-size: 12px; margin: 0 0 24px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row button { font: inherit; font-size: 13px; color: #05070b; background: #3ee6c4; border: 0; border-radius: 8px; padding: 12px 18px; cursor: pointer; }
  pre { margin-top: 24px; font-size: 11px; color: #8a93a6; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
</style>
</head>
<body>
<main>
  <h1>LOFT GAMES</h1>
  <p>A test page for the three mini games. Esc closes a game. Events show below.</p>
  <div class="row">
    <button data-game="striker">Striker 22</button>
    <button data-game="holochess">Holochess</button>
    <button data-game="backgammon">Backgammon</button>
  </div>
  <pre id="log"></pre>
</main>
<script type="module">
  import { openGame, isGameOpen } from '../src/games/index.js';
  const log = document.getElementById('log');
  const line = s => { log.textContent = `${s}\n${log.textContent}`.slice(0, 4000); };
  window.__events = [];
  document.querySelectorAll('[data-game]').forEach(b => b.addEventListener('click', () => {
    openGame(b.dataset.game, {
      onClose: () => line(`closed ${b.dataset.game}`),
      onEvent: (type, data) => { window.__events.push([type, data]); line(`${type} ${JSON.stringify(data)}`); },
    });
  }));
  // Lets a test check that the page underneath never hears game keys.
  window.__pageKeys = [];
  addEventListener('keydown', e => window.__pageKeys.push(e.key));
  window.__isGameOpen = isGameOpen;
</script>
</body>
</html>
