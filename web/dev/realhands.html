<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real Hands Bench</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #14161a; --ink: #e8e6e1; --dim: #9a978f; --on: #6fc3a0; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #bar { position: fixed; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100vw - 16px); }
  button { background: #2a2e36; color: var(--ink); border: 1px solid #3a3f49; border-radius: 6px; padding: 4px 8px; cursor: pointer; font: inherit; }
  button.on { border-color: var(--on); color: var(--on); }
  #info { position: fixed; left: 8px; bottom: 8px; color: var(--dim); white-space: pre; font: 11px ui-monospace, Consolas, monospace; }
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

</script>
</head>

<div id="bar"></div>
<div id="info"></div>

</html>
