<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loft Audio Bench</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #14161a; --panel: #1d2026; --ink: #e8e6e1; --dim: #9a978f; --accent: #e0a458; --on: #6fc3a0; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 0 0 8px; }
  section { background: var(--panel); border-radius: 8px; padding: 12px; margin: 12px 0; }
  button { background: #2a2e36; color: var(--ink); border: 1px solid #3a3f49; border-radius: 6px; padding: 6px 10px; margin: 2px; cursor: pointer; font: inherit; }
  button.on { border-color: var(--on); color: var(--on); }
  label { margin-right: 12px; color: var(--dim); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 4px 0; }
  .meter { width: 200px; height: 10px; background: #2a2e36; border-radius: 5px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--accent); }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #2a2e36; display: inline-block; }
  .dot.beat { background: var(--accent); }
  #keys { position: relative; height: 110px; overflow-x: auto; white-space: nowrap; user-select: none; touch-action: none; }
  .wk, .bk { position: absolute; top: 0; border: 1px solid #000; border-radius: 0 0 4px 4px; }
  .wk { width: 22px; height: 104px; background: #f2efe8; }
  .bk { width: 14px; height: 64px; background: #222; z-index: 1; }
  .wk.lit { background: var(--accent); } .bk.lit { background: #b8742a; }
  .wk.bh22, .bk.bh22 { background: var(--on); }
  .wk.mark::after { content: attr(data-n); position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 9px; color: #555; }
  pre { margin: 0; color: var(--dim); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  input[type=range] { width: 120px; }
</style>
</head>
<body>
<h1>Loft audio bench</h1>
<p style="color: var(--dim); margin: 0">Every sound here is synthesised live. The first click starts the audio context. Piano keys: A W S E D F T G Y H U J K, Z and X shift the octave, hold Shift for the sustain pedal.</p>

<section>
  <h2>Records</h2>
  <div class="row" id="records"></div>
  <div class="row"><span class="meter"><i id="lvl"></i></span> <span class="dot" id="beat"></span> <span id="now" style="color: var(--dim)"></span></div>
</section>

<section>
  <h2>Grand piano</h2>
  <div id="keys"></div>
  <div class="row"><button id="sus">Sustain off</button> <span id="oct" style="color: var(--dim)"></span></div>
  <div class="row" id="songs"></div>
  <div class="row"><label><input type="checkbox" id="duet"> Duet with BH-22</label> <button id="stopsong">Stop song</button></div>
</section>

<section>
  <h2>Effects</h2>
  <div class="row"><label>Position <select id="pos"><option value="">none</option><option value="-4,1,0">left 4 m</option><option value="4,1,0">right 4 m</option><option value="0,1,-12">ahead 12 m</option></select></label></div>
  <div class="row" id="fx"></div>
</section>

<section>
  <h2>Ambience</h2>
  <div class="row" id="amb"></div>
</section>

<section>
  <h2>Live counts</h2>
  <pre id="stats"></pre>
</section>

<script type="module">
import { Sound } from '../sound.js';
import { makeAudio } from '../src/audio/index.js';
import { makeEngine, makeClock, stats } from '../src/audio/core.js';
import { offlineRecord, sequence } from '../src/audio/music.js';
import { pianoVoice } from '../src/audio/synths.js';
import { makeSfx } from '../src/audio/sfx.js';
import { makeAmbience } from '../src/audio/ambience.js';
import { RECORDS } from '../src/audio/pure/records.js';

const $ = id => document.getElementById(id);
const sound = new Sound();
const audio = makeAudio(sound);
window.sound = sound; window.audio = audio; window.audioStats = stats;
addEventListener('pointerdown', () => sound.start(), { capture: true });
addEventListener('keydown', () => sound.start(), { capture: true });

const btn = (parent, text, fn) => { const b = document.createElement('button'); b.textContent = text; b.onclick = () => { sound.start(); fn(b); }; parent.append(b); return b; };
const posVal = () => { const v = $('pos').value; return v ? v.split(',').map(Number) : undefined; };

for (const r of audio.music.records) btn($('records'), r.title, () => audio.music.play(r.id)).title = r.mood;
btn($('records'), 'Stop', () => audio.music.stop());
let beats = 0;
audio.music.onBeat(b => { beats++; $('beat').classList.add('beat'); setTimeout(() => $('beat').classList.remove('beat'), 90); });

const keyEls = new Map(), LO = 36, HI = 96;
let x = 0;
for (let m = LO; m <= HI; m++) {
  const black = [1, 3, 6, 8, 10].includes(m % 12), k = document.createElement('div');
  k.className = black ? 'bk' : 'wk' + (m % 12 === 0 ? ' mark' : '');
  if (m % 12 === 0) k.dataset.n = 'C' + (m / 12 - 1);
  k.style.left = (black ? x - 8 : x) + 'px';
  if (!black) x += 22;
  k.onpointerdown = ev => { sound.start(); k.setPointerCapture(ev.pointerId); audio.piano.noteOn(m, 0.75); k.classList.add('lit'); };
  k.onpointerup = k.onpointercancel = () => { audio.piano.noteOff(m); k.classList.remove('lit'); };
  keyEls.set(m, k); $('keys').append(k);
}
const showOct = () => { $('oct').textContent = 'Keyboard octave: C' + (4 + audio.piano.octave); };
showOct();
const setSus = on => { audio.piano.setSustain(on); $('sus').textContent = on ? 'Sustain on' : 'Sustain off'; $('sus').classList.toggle('on', on); };
let sus = false;
$('sus').onclick = () => { sound.start(); sus = !sus; setSus(sus); };
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.key === 'Shift') return setSus(true);
  const m = audio.piano.keyToMidi(e);
  showOct();
  if (m == null || e.repeat) return;
  audio.piano.noteOn(m, 0.75);
  keyEls.get(m)?.classList.add('lit');
});
addEventListener('keyup', e => {
  if (e.key === 'Shift') return setSus(sus);
  const m = audio.piano.keyToMidi(e);
  if (m == null) return;
  audio.piano.noteOff(m);
  keyEls.get(m)?.classList.remove('lit');
});
let lit = 0, songNotes = 0;
const onNote = n => {
  const k = keyEls.get(n.midi);
  if (n.on) { songNotes++; lit++; } else lit--;
  if (k) k.classList.toggle(n.who === 'bh22' ? 'bh22' : 'lit', n.on);
};
for (const s of audio.piano.songs) btn($('songs'), s.title, () => audio.piano.playSong(s.id, { duet: $('duet').checked, onNote }));
$('stopsong').onclick = () => audio.piano.stopSong();

const pos = () => posVal();
const fx = [
  ['BH-22 happy', () => audio.sfx.bh22('happy', pos())], ['curious', () => audio.sfx.bh22('curious', pos())], ['sad', () => audio.sfx.bh22('sad', pos())], ['alert', () => audio.sfx.bh22('alert', pos())],
  ...['hello', 'Behbod', 'oh no', 'yay', 'follow me'].map(w => ['"' + w + '"', () => audio.sfx.bh22Word(w, pos())]),
  ['mouse', () => audio.sfx.mouse(pos())], ['meow', () => audio.sfx.meow(pos())], ['woof', () => audio.sfx.woof(pos())], ['pant', () => audio.sfx.pant(pos())],
  ['glass door', () => audio.sfx.door('glass', pos())], ['bookcase', () => audio.sfx.door('bookcase', pos())], ['wardrobe', () => audio.sfx.door('wardrobe', pos())],
  ['ball kick', () => audio.sfx.kick(pos())], ['target hit', () => audio.sfx.hit(pos())], ['miss', () => audio.sfx.miss(pos())],
  ['achievement', () => audio.sfx.achievement(pos())], ['DEPLOY', () => audio.sfx.deploy(pos())], ['click', () => audio.sfx.click(pos())], ['holo blip', () => audio.sfx.blip(pos())], ['pour tea', () => audio.sfx.pour(pos())],
];
for (const [t, f] of fx) btn($('fx'), t, f);
for (const name of ['purr', 'printer']) { let on = false; btn($('fx'), name + ' loop', b => { on = !on; audio.sfx[name](on, pos()); b.classList.toggle('on', on); }); }

for (const name of ['rain', 'fire', 'city', 'waves', 'wind']) {
  const l = document.createElement('label'), r = document.createElement('input');
  r.type = 'range'; r.min = 0; r.max = 1; r.step = 0.01; r.value = 0;
  r.oninput = () => { sound.start(); audio.ambience.set(name, +r.value); };
  l.append(name + ' ', r); $('amb').append(l);
}

audio.setListener([0, 1, 0], [0, 0, -1]);
let last = performance.now();
(function frame(t) {
  audio.tick((t - last) / 1000); last = t;
  $('lvl').style.width = (audio.music.level() * 100).toFixed(1) + '%';
  $('now').textContent = audio.music.current ? 'Playing ' + audio.music.current + ', beats ' + beats : '';
  $('stats').textContent = JSON.stringify({ ...stats, songNotes, litKeys: lit, ctx: sound.ctx ? sound.ctx.state : 'not started' });
  requestAnimationFrame(frame);
})(last);

// Measurement helpers for automated checks: render into an OfflineAudioContext and read the numbers back.
async function offline(seconds, fn, sr = 44100) {
  const ctx = new OfflineAudioContext(2, Math.ceil(seconds * sr), sr), master = ctx.createGain();
  master.gain.value = 0.9; master.connect(ctx.destination);
  const e = makeEngine(ctx, master);
  fn(e, ctx);
  return ctx.startRendering();
}
function measure(buf) {
  let peak = 0, sum = 0, n = 0, bad = 0;
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < d.length; i++) { const v = d[i]; if (!Number.isFinite(v)) { bad++; continue; } const a = Math.abs(v); if (a > peak) peak = a; sum += v * v; n++; }
  }
  const sr = buf.sampleRate, d = buf.getChannelData(0), win = Math.round(sr * 0.5);
  let quiet = 0, wins = 0;
  for (let i = 0; i + win <= d.length; i += win) { let s = 0; for (let k = i; k < i + win; k++) s += d[k] * d[k]; wins++; if (Math.sqrt(s / win) < 0.003) quiet++; }
  const ch = c => { const x = buf.getChannelData(Math.min(c, buf.numberOfChannels - 1)); let s = 0; for (let i = 0; i < x.length; i++) s += x[i] * x[i]; return s; };
  return { leftMinusRightDb: +(10 * Math.log10((ch(0) + 1e-12) / (ch(1) + 1e-12))).toFixed(1), peak: +peak.toFixed(4), rmsDb: +(10 * Math.log10(sum / n + 1e-12)).toFixed(1), quietHalfSeconds: quiet, halfSeconds: wins, nonFinite: bad };
}
function beatPeriod(buf, beat) {
  const sr = buf.sampleRate, d = buf.getChannelData(0), hop = Math.round(sr / 200), env = [];
  for (let i = 0; i + hop <= d.length; i += hop) { let s = 0; for (let k = i; k < i + hop; k++) s += d[k] * d[k]; env.push(Math.sqrt(s / hop)); }
  const on = env.map((v, i) => Math.max(0, v - (env[i - 1] || 0)));
  const mean = on.reduce((a, b) => a + b, 0) / on.length, o = on.map(v => v - mean);
  const ac = lag => { let s = 0; for (let i = 0; i + lag < o.length; i++) s += o[i] * o[i + lag]; return s; };
  let best = 0, bestLag = 0;
  for (let lag = 90; lag <= 320; lag++) { const s = ac(lag); if (s > best) { best = s; bestLag = lag; } }
  const at = Math.round(beat * 200), atBeat = Math.max(ac(at - 1), ac(at), ac(at + 1));
  const off = Math.max(ac(Math.round(at * 0.82)), ac(Math.round(at * 1.18)));
  const acs = []; for (let lag = 50; lag <= 640; lag++) acs.push([lag / 200, ac(lag)]);
  const top = acs.filter((p, i) => i > 0 && i < acs.length - 1 && p[1] > acs[i - 1][1] && p[1] >= acs[i + 1][1]).sort((a, b) => b[1] - a[1]).slice(0, 4).map(p => p[0]);
  return { detectedPeriod: bestLag / 200, topPeriods: top, beatVsBest: +(atBeat / best).toFixed(2), beatVsOffBeat: +(atBeat / Math.max(1e-9, off)).toFixed(2) };
}
function pitch(buf, from = 0.08, len = 0.25) {
  const sr = buf.sampleRate, d = buf.getChannelData(0), s0 = Math.round(from * sr), N = Math.round(len * sr), x = d.subarray(s0, s0 + N);
  const maxLag = Math.round(sr / 25), minLag = Math.round(sr / 4500), r = new Float32Array(maxLag + 2);
  for (let lag = minLag; lag <= maxLag + 1; lag++) { let s = 0, e1 = 0, e2 = 0; for (let i = 0; i + lag < N; i++) { s += x[i] * x[i + lag]; e1 += x[i] * x[i]; e2 += x[i + lag] * x[i + lag]; } r[lag] = s / Math.sqrt(e1 * e2 + 1e-12); }
  let peak = 0;
  for (let lag = minLag; lag <= maxLag; lag++) if (r[lag] > peak) peak = r[lag];
  let lag = minLag;
  for (; lag <= maxLag; lag++) if (r[lag] >= peak * 0.92 && r[lag] >= r[lag - 1] && r[lag] >= r[lag + 1]) break;
  const a = r[lag - 1], b = r[lag], c = r[lag + 1], shift = (a - c) / (2 * (a - 2 * b + c) || 1);
  return sr / (lag + shift);
}
const fakeEnv = e => ({ sound: { on: true }, eng: () => e, ready: () => e, clock: makeClock() });

window.audioCheck = {
  async records(seconds, noCrackle = false) {
    const out = [];
    for (const r of RECORDS) {
      const seq = sequence(r.id), secs = seconds || seq.duration, t0 = performance.now();
      const buf = await offline(secs, (e, ctx) => { const rec = offlineRecord(e, r.id, { crackle: !noCrackle }); rec.window(0, 0.5); for (let t = 0.25; t < secs; t += 0.25) ctx.suspend(t).then(() => { rec.window(t + 0.25, t + 0.5); ctx.resume(); }); });
      out.push({ id: r.id, bpm: r.bpm, seconds: +secs.toFixed(1), renderMs: Math.round(performance.now() - t0), beatsInLoop: seq.bars * seq.beatsPerBar, expectedBeat: +seq.beatDur.toFixed(3), ...beatPeriod(buf, seq.beatDur), ...measure(buf) });
    }
    return out;
  },
  async piano(notes = [45, 57, 60, 69, 76, 84]) {
    const out = [];
    for (const m of notes) {
      const buf = await offline(1.5, e => pianoVoice(e, e.pianoIn, 0, m, 0.8));
      const f = pitch(buf), want = 440 * Math.pow(2, (m - 69) / 12);
      out.push({ midi: m, expectHz: +want.toFixed(2), gotHz: +f.toFixed(2), cents: +(1200 * Math.log2(f / want)).toFixed(1), ...measure(buf) });
    }
    return out;
  },
  async sfx() {
    const calls = [['bh22 happy', s => s.bh22('happy')], ['bh22 curious', s => s.bh22('curious')], ['bh22 sad', s => s.bh22('sad')], ['bh22 alert', s => s.bh22('alert')],
      ...['hello', 'Behbod', 'oh no', 'yay', 'follow me'].map(w => ['word ' + w, s => s.bh22Word(w)]),
      ['mouse', s => s.mouse()], ['meow', s => s.meow()], ['woof', s => s.woof()], ['pant', s => s.pant()],
      ['door glass', s => s.door('glass')], ['door bookcase', s => s.door('bookcase')], ['door wardrobe', s => s.door('wardrobe')],
      ['kick', s => s.kick()], ['hit', s => s.hit()], ['miss', s => s.miss()], ['achievement', s => s.achievement()], ['deploy', s => s.deploy()],
      ['click', s => s.click()], ['blip', s => s.blip()], ['pour', s => s.pour()], ['purr', s => s.purr(true)], ['printer', s => s.printer(true)],
      ['meow at 10 m', s => s.meow([0, 0, -10])], ['meow 4 m left', s => s.meow([-4, 0, 0])], ['meow 4 m right', s => s.meow([4, 0, 0])]];
    const out = [];
    for (const [name, f] of calls) {
      const buf = await offline(3.2, e => { e.ctx.listener.positionX && (e.ctx.listener.positionX.value = 0); f(makeSfx(fakeEnv(e))); });
      out.push({ name, ...measure(buf) });
    }
    return out;
  },
  async ambience() {
    const out = [];
    for (const name of ['rain', 'fire', 'city', 'waves', 'wind']) {
      const buf = await offline(4, e => makeAmbience(fakeEnv(e)).set(name, 1));
      out.push({ name, ...measure(buf) });
    }
    return out;
  },
};
</script>
</body>
</html>
