<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="frame-src https://en.wikipedia.org https://behi22.github.io https://aic-voice-microsite.vercel.app https://www.youtube-nocookie.com">
<title>Behbod's Home</title>
<!-- My tab icon, BH-22 smiling: an SVG for browsers that take one, the .ico for the rest (Safari among them), and the
     home-screen picture iPhones round themselves. -->
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=JetBrains+Mono:wght@400;700&family=Noto+Nastaliq+Urdu:wght@500&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --accent: #3ee6c4; --ink: #e8edf5; --dim: #8a93a6; --bg: #05070b; --panel: rgba(8, 12, 18, .72); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; inset: 0; pointer-events: none; }
  .keys { position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--dim); max-width: calc(100% - 32px); }
  body[data-mode="desk"] .keys, body[data-mode="range"] .keys, body[data-mode="pens"] .keys, body[data-mode="scope"] .keys,
  body[data-mode="desk"] .joy, body[data-mode="range"] .joy, body[data-mode="pens"] .joy, body[data-mode="scope"] .joy { display: none; }
  /* At the firing line the range has the glass to itself, bar the sound switch. */
  body[data-mode="range"] .tag, body[data-mode="range"] #who, body[data-mode="range"] #hood, body[data-mode="range"] #closet, body[data-mode="range"] .touch, body[data-mode="range"] .prompt { display: none; }
  .keys b { display: inline-block; min-width: 18px; padding: 2px 6px; margin-right: 4px; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 5px; color: var(--accent); text-align: center; font-weight: 700; box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 25%, transparent); }
  .prompt { position: absolute; left: 50%; top: 62%; transform: translate(-50%, 0); padding: 8px 14px; background: var(--panel); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; white-space: nowrap; }
  .prompt.on { opacity: 1; }
  .toast { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); padding: 8px 14px; background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; font-size: 13px; color: var(--accent); opacity: 0; transition: opacity .3s; width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box; text-align: center; }
  .toast.on { opacity: 1; }
  .toast.notice { top: calc(18% + 64px); }
  .prompt b { color: var(--bg); background: var(--accent); padding: 1px 8px; border-radius: 4px; margin-right: 8px; }
  .corner { position: absolute; right: calc(16px + env(safe-area-inset-right, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; pointer-events: auto; max-width: calc(100% - 150px); }
  .joy { display: none; }
  .chip { font: inherit; font-size: 12px; color: var(--ink); background: var(--panel); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .tag { position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); font-size: 12px; color: var(--dim); letter-spacing: .08em; }
  .tag b { color: var(--accent); font-weight: 700; }
  .stats { position: absolute; right: calc(16px + env(safe-area-inset-right, 0px)); top: calc(52px + env(safe-area-inset-top, 0px)); font-size: 11px; color: var(--dim); text-align: right; display: none; }
  /* The door and my story, in blueprint ink: drawing-paper blue, white-blue ink in three strengths. */
  :root { --bp-paper: #0c2350; --bp-deep: #071636; --bp-grid: rgba(150,195,255,.075); --bp-ink: #f2f7ff; --bp-soft: #b5cff2; --bp-faint: #7d9cc9; --bp-line: #dceaff; --bp-glow: rgba(170,210,255,.38); --bp-navy: #0b1f45; --display: 'Archivo', 'Arial Black', sans-serif; }
  .gate, .i-paper { background: linear-gradient(var(--bp-grid) 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(90deg, var(--bp-grid) 1px, transparent 1px) 0 0 / 24px 24px, radial-gradient(ellipse at 50% 40%, var(--bp-paper) 0%, var(--bp-deep) 100%); }
  .gate { position: fixed; inset: 0; z-index: 5; transition: opacity .6s; }
  /* Once faded the door is hidden outright, or its buttons stay clickable and reachable by Tab in the middle of the screen. */
  .gate.gone { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .6s, visibility 0s linear .6s; }
  .i-col { position: absolute; inset: 0 0 110px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(16px, 3.4vh, 30px); padding: 0 24px; text-align: center; }
  .i-housebox { position: relative; width: min(36vw, 420px, 46vh); }
  .i-house { display: block; width: 100%; overflow: visible; filter: drop-shadow(0 0 6px var(--bp-glow)); }
  .i-house path { fill: none; stroke: var(--bp-line); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .i-house .i-tick { stroke: var(--bp-faint); stroke-width: 1; stroke-dashoffset: 0; }
  .i-name h1, .i-name h2 { font: 900 clamp(30px, 7.5vw, 90px)/.9 var(--display); letter-spacing: .04em; margin: 0; color: var(--bp-ink); }
  .i-name h2 { font-size: clamp(28px, 6vw, 72px); }
  .i-name p { margin: 12px 0 0; font-size: clamp(10px, 1.4vw, 14px); letter-spacing: .7em; padding-left: .7em; color: var(--bp-soft); }
  .i-prompt { display: grid; gap: 10px; justify-items: center; }
  /* Story skipped before home was ready: only the drawing and the loading line, then straight in. */
  .gate.going .i-prompt { visibility: hidden; }
  .i-press { font: inherit; font-weight: 700; font-size: clamp(12px, 1.5vw, 16px); letter-spacing: .32em; padding: 4px 0 4px .32em; color: var(--bp-ink); background: none; border: 0; cursor: pointer; animation: i-pulse 1.8s ease-in-out infinite; }
  .i-sub { color: var(--bp-soft); font-size: clamp(10px, 1.1vw, 12px); letter-spacing: .08em; }
  .i-goin { font: inherit; font-size: clamp(10px, 1.1vw, 12px); color: var(--bp-ink); background: rgba(181,207,242,.08); border: 1px solid rgba(181,207,242,.4); border-radius: 999px; padding: 7px 16px; margin-top: 6px; cursor: pointer; }
  .i-goin[aria-disabled="true"] { color: var(--bp-faint); border-color: rgba(125,156,201,.3); background: transparent; cursor: default; }
  .gate button:focus-visible, .i-btn:focus-visible { outline: 2px solid var(--bp-soft); outline-offset: 3px; }
  @keyframes i-pulse { 50% { opacity: .4; } }
  /* The loading line: a dimension line being drawn, a tick every tenth, BH-22 riding its head. Over my story it sits in
     the story's own black bar (the picture is 1920 by 804 inside 1920 by 1080), as one row on a wide screen. */
  .i-load { position: fixed; z-index: 7; left: max(28px, 3.4vw); bottom: calc(max(20px, 2.4vw) + env(safe-area-inset-bottom, 0px)); width: min(340px, 36vw); display: grid; gap: 8px; font-size: clamp(10px, 1.05vw, 12px); color: var(--bp-ink); pointer-events: none; }
  .i-gauge { position: relative; height: 12px; margin-top: 48px; }
  .i-gauge .base { position: absolute; left: 0; right: 0; top: 5px; height: 1px; background: repeating-linear-gradient(90deg, var(--bp-faint) 0 4px, transparent 4px 8px); opacity: .7; }
  .i-gauge .done { position: absolute; left: 0; top: 4px; height: 3px; width: 100%; background: var(--bp-ink); box-shadow: 0 0 8px var(--bp-glow); border-radius: 2px; transform: scaleX(0); transform-origin: 0 50%; transition: transform 2s linear; will-change: transform; }
  .i-rider { position: absolute; left: 0; bottom: 7px; width: 100%; height: 0; transition: transform 2s linear; will-change: transform; }
  .i-rider .i-bh { bottom: 0; }
  .i-gauge .ticks i { position: absolute; top: 2px; width: 1px; height: 8px; background: var(--bp-faint); transition: background .3s; }
  .i-gauge .ticks i.cap { top: 0; height: 12px; }
  .i-gauge .ticks i.lit { background: var(--bp-ink); }
  /* Their own display would beat the hidden attribute, so hidden is spelt out. */
  .i-load[hidden], .i-skip[hidden] { display: none; }
  .i-load .meta { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .i-load .say { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .25s; min-width: 0; }
  .i-load .say.out { opacity: 0; }
  .i-load .pct { color: var(--bp-soft); font-variant-numeric: tabular-nums; }
  .i-load.over { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(620px, 56vw); grid-template-columns: minmax(0, 1fr) auto minmax(0, 190px); align-items: end; gap: 16px; }
  .i-load.over .meta { display: contents; }
  .i-load.over .i-gauge { order: 1; margin: 0 0 3px; } .i-load.over .pct { order: 2; } .i-load.over .say { order: 3; }
  .i-load.over .i-bh { width: 28px; height: 35px; }
  /* BH-22, the Hopper */
  .i-bh { position: absolute; bottom: 7px; left: 0; width: 38px; height: 48px; transform: translateX(-50%); }
  .i-bh svg { width: 100%; height: 100%; overflow: visible; }
  .i-bh .all { transform-origin: 24px 58px; }
  .i-bh.moving .all { animation: i-bob .3s ease-in-out infinite alternate; }
  .i-bh .spin { transform-box: fill-box; transform-origin: center; animation: i-turn .42s linear infinite; animation-play-state: paused; }
  .i-bh.moving .spin { animation-play-state: running; }
  .i-bh .bodyg { transform-origin: 24px 52px; transition: rotate .35s ease; }
  .i-bh.moving .bodyg { rotate: 8deg; }
  .i-bh .dome { transform-origin: 24px 34px; transition: rotate .5s ease, translate .5s ease; }
  .i-bh.moving .dome { rotate: -3deg; }
  .i-bh .eyes { transition: translate .35s ease; }
  .i-bh .eye { transform-box: fill-box; transform-origin: center; animation: i-blink 3.6s infinite; }
  .i-bh .happy { display: none; }
  .i-bh.glad .eye { display: none; } .i-bh.glad .happy { display: inline; }
  .i-bh .ant { transform-origin: 24px 9px; }
  .i-bh .ant.wob { animation: i-wob .9s ease-out; }
  .i-bh .ball { animation: i-pulse 1.4s ease-in-out infinite; }
  .i-bh.hop .all { animation: i-hop .75s cubic-bezier(.3,.6,.4,1); }
  @keyframes i-bob { to { translate: 0 -1.2px; } }
  @keyframes i-turn { to { rotate: 360deg; } }
  @keyframes i-blink { 0%, 94%, 100% { scale: 1 1; } 97% { scale: 1 .12; } }
  @keyframes i-wob { 15% { rotate: 16deg; } 35% { rotate: -11deg; } 55% { rotate: 6deg; } 75% { rotate: -3deg; } 100% { rotate: 0deg; } }
  @keyframes i-hop { 0% { scale: 1 1; translate: 0 0; } 16% { scale: 1.1 .88; translate: 0 0; } 46% { scale: .94 1.08; translate: 0 -14px; } 76% { scale: 1.08 .92; translate: 0 0; } 100% { scale: 1 1; translate: 0 0; } }
  .veil { position: fixed; inset: 0; background: #05070b; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 4; }
  .veil.on { opacity: 1; }
  .video { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; gap: 12px; align-content: center; background: rgba(5, 7, 11, .82); padding: 16px; }
  .video iframe { width: min(960px, 100%); aspect-ratio: 16 / 9; border: 0; border-radius: 10px; background: #000; }
  .video video { display: block; aspect-ratio: 16 / 9; border-radius: 10px; background: #000;
    width: min(1280px, 100%, calc((100vh - 96px) * 16 / 9)); width: min(1280px, 100%, calc((100dvh - 96px) * 16 / 9)); }
  .video.tall video { aspect-ratio: 9 / 16; width: min(100%, calc((100vh - 96px) * 9 / 16)); width: min(100%, calc((100dvh - 96px) * 9 / 16)); }
  /* My story fills the window, no player: the picture, the skip ring, and at the door its end on the drawing. */
  .video.film { display: block; padding: 0; background: #000; }
  .video.film:focus { outline: none; }
  .video.film.leaving { opacity: 0; transition: opacity .6s ease; pointer-events: none; }
  /* In from the story: the door goes at once, under the story fading out. */
  .gate.instant.gone { transition: none; }
  .video.film video { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; border-radius: 0; object-fit: contain; }
  .video.film.tall video { top: calc(44px + env(safe-area-inset-top, 0px)); height: calc(100% - 140px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
  .film-note { position: absolute; left: 0; right: 0; bottom: 30%; margin: 0; text-align: center; color: var(--bp-soft); font-size: 12px; }
  .i-end .film-note { position: static; }
  .i-skip { position: absolute; right: max(28px, 3.4vw); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 10px; font-size: clamp(10px, 1.05vw, 12px); color: var(--bp-ink); }
  .video.film.tall .i-skip { bottom: auto; top: calc(8px + env(safe-area-inset-top, 0px)); right: 20px; }
  .i-skip kbd, .i-btn kbd { font: 700 10px 'JetBrains Mono', monospace; border: 1px solid currentColor; border-radius: 4px; padding: 1px 6px; opacity: .75; }
  .i-ring { width: 28px; height: 28px; }
  .i-ring circle { fill: none; stroke-width: 3; }
  .i-ring .bgc { stroke: rgba(181,207,242,.22); }
  .i-ring .fg { stroke: var(--bp-ink); stroke-dasharray: 1; stroke-dashoffset: 1; transform: rotate(-90deg); transform-origin: center; }
  .i-end { position: absolute; inset: 0; animation: i-fade .8s ease both; }
  .i-end .i-col { inset: 0; }
  .i-end .i-house path:not(.i-tick) { animation: i-draw 1.3s ease forwards; }
  .i-door { position: absolute; left: 20.5%; top: 75.4%; width: 7%; height: 17.8%; background: linear-gradient(180deg, rgba(242,247,255,.55), rgba(181,207,242,.15)); box-shadow: 0 0 18px rgba(200,225,255,.6); opacity: 0; transition: opacity 1s ease; }
  .i-door.on { opacity: 1; }
  .i-end .i-endbh { bottom: 6.5%; left: -8%; width: 14%; height: auto; aspect-ratio: 48 / 60; transition: left 1.8s cubic-bezier(.35,.1,.3,1); }
  .i-end .i-endbh.there { left: 34%; }
  .i-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
  .i-reveal { opacity: 0; translate: 0 8px; transition: opacity .7s ease, translate .7s ease; }
  .i-reveal.in { opacity: 1; translate: 0 0; }
  .i-btn { font: 700 clamp(12px, 1.3vw, 14px) 'JetBrains Mono', monospace; letter-spacing: .08em; border-radius: 8px; padding: 11px 24px; cursor: pointer; display: inline-flex; gap: 10px; align-items: center; justify-content: center; }
  .i-btn.main { background: var(--bp-ink); color: var(--bp-navy); border: 1px solid var(--bp-ink); box-shadow: 0 0 18px rgba(200,225,255,.25); }
  .i-btn.alt { background: rgba(181,207,242,.06); color: var(--bp-ink); border: 1px solid rgba(181,207,242,.45); }
  .i-btn:disabled { opacity: .45; cursor: default; }
  @keyframes i-fade { from { opacity: 0; } }
  @keyframes i-draw { to { stroke-dashoffset: 0; } }
  /* A screen taller than it is wide: a wider house, the loading line across the bottom, the buttons stacked. */
  @media (orientation: portrait) {
    .i-housebox { width: min(76vw, 40vh); }
    .i-name h1 { font-size: clamp(30px, 9vw, 60px); }
    .i-load, .i-load.over { left: 24px; right: 24px; width: auto; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: none; gap: 8px; }
    .i-load.over .meta { display: flex; }
    .i-load.over .i-gauge { margin: 48px 0 0; }
    .i-load.over .i-bh { width: 32px; height: 40px; }
    .i-row { flex-direction: column; width: 100%; max-width: 240px; }
    .i-press { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { .i-press, .i-bh *, .i-bh, .i-end, .i-end .i-house path { animation: none !important; } .i-end .i-house path { stroke-dashoffset: 0; } .i-reveal, .i-endbh { transition: none !important; } }
  .touch { display: none; }
  .cmd { display: none; position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); font: inherit; font-size: 16px; color: var(--ink); background: var(--panel); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 8px; padding: 10px 12px; pointer-events: auto; }
  .cmd:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (pointer: coarse) {
    .keys { display: none; }
    .touch { display: flex; position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: center; width: calc(100% - 32px); }
    .prompt { top: auto; bottom: 74px; }
    .joy { display: block; position: absolute; left: calc(20px + env(safe-area-inset-left, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); width: 112px; height: 112px; border-radius: 50%;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.18); pointer-events: auto; touch-action: none; }
    .joy i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 35%, transparent); border: 1px solid var(--accent); }
    .at-desk .cmd { display: block; }
    .at-desk .prompt { display: none; }
  }
  @media (max-width: 560px) {
    .tag .long { display: none; }
    .corner { top: calc(44px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); flex-wrap: wrap; }
    .stats { top: calc(124px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); right: auto; text-align: left; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="hud">
  <div class="tag"><b>BEHBOD</b> · HOME<span class="long"> · WORK IN PROGRESS</span></div>
  <div class="corner"><button class="chip" id="who">Head: hood</button><button class="chip" id="hood">Hood up</button><button class="chip" id="closet">Wardrobe</button><button class="chip" id="snd">Sound off</button></div>
  <div class="stats" id="stats"></div>
  <input id="cmd" class="cmd" type="text" enterkeyhint="send" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type a command, like help" aria-label="Terminal command">
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="toast notice" id="notice" role="status" aria-live="polite"></div>
  <div class="prompt" id="prompt"><b>E</b>Use computer</div>
  <div class="keys"><span><b>WASD</b>move</span><span><b>Shift</b>run</span><span><b>Space</b>jump</span><span><b>Drag</b>look</span><span><b>E</b>use</span><span><b>C</b>crouch, tap twice to roll</span><span><b>H</b>head</span><span><b>G</b>hood</span><span><b>O</b>wardrobe</span><span><b>Click</b>walk there</span><span><b>Esc</b>back</span></div>
  <div class="joy" id="joy" aria-label="Walk"><i></i></div>
  <div class="touch"><button class="chip" data-go="desk">Desk</button><button class="chip" data-go="window">Window</button><button class="chip" data-go="lounge">Lounge</button><button class="chip" id="use">Use</button></div>
</div>
<div class="veil" id="veil"></div>
<div class="gate" id="gate"><div class="i-col"><div class="i-housebox"><svg class="i-house" viewBox="0 0 400 236" aria-hidden="true"></svg></div><div class="i-name"><h1>BEHBOD</h1><p>HOME</p></div><div class="i-prompt"><button id="film" class="i-press" type="button">PRESS ANY KEY</button><div class="i-sub">to watch my story · 2 min</div><button id="enter" class="i-goin" type="button" aria-disabled="true">You can skip it once home is ready · 0%</button></div></div></div>
<div class="i-load" id="loading"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="bhGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="bhDome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f4c"/><stop offset=".35" stop-color="#1c1f27"/><stop offset="1" stop-color="#0e1015"/></linearGradient><linearGradient id="bhScreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b111c"/><stop offset="1" stop-color="#03050a"/></linearGradient></defs></svg>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.36.4/build/index.js"
} }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
