<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Behbod's Loft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Nastaliq+Urdu:wght@500&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --accent: #3ee6c4; --ink: #e8edf5; --dim: #8a93a6; --bg: #05070b; --panel: rgba(8, 12, 18, .72); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; inset: 0; pointer-events: none; }
  .keys { position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--dim); max-width: calc(100% - 32px); }
  .keys b { display: inline-block; min-width: 18px; padding: 2px 6px; margin-right: 4px; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 5px; color: var(--accent); text-align: center; font-weight: 700; box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 25%, transparent); }
  .prompt { position: absolute; left: 50%; top: 62%; transform: translate(-50%, 0); padding: 8px 14px; background: var(--panel); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; white-space: nowrap; }
  .prompt.on { opacity: 1; }
  .toast { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); padding: 8px 14px; background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; font-size: 13px; color: var(--accent); opacity: 0; transition: opacity .3s; white-space: nowrap; }
  .toast.on { opacity: 1; }
  .prompt b { color: var(--bg); background: var(--accent); padding: 1px 8px; border-radius: 4px; margin-right: 8px; }
  .corner { position: absolute; right: calc(16px + env(safe-area-inset-right, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; pointer-events: auto; }
  .chip { font: inherit; font-size: 12px; color: var(--ink); background: var(--panel); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .tag { position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); font-size: 12px; color: var(--dim); letter-spacing: .08em; }
  .tag b { color: var(--accent); font-weight: 700; }
  .stats { position: absolute; right: calc(16px + env(safe-area-inset-right, 0px)); top: calc(52px + env(safe-area-inset-top, 0px)); font-size: 11px; color: var(--dim); text-align: right; display: none; }
  .gate { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #0d1420 0%, #05070b 70%); z-index: 5; transition: opacity .6s; }
  .gate.gone { opacity: 0; pointer-events: none; }
  .gate .box { text-align: center; padding: 0 16px; }
  .gate h1 { font-size: 15px; letter-spacing: .3em; font-weight: 700; margin: 0 0 18px; color: var(--accent); }
  .bar { width: min(320px, 80vw); height: 3px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; margin: 0 auto 16px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 12px var(--accent); transition: width .2s; }
  .gate button { font: inherit; font-size: 13px; color: var(--bg); background: var(--accent); border: 0; border-radius: 6px; padding: 10px 22px; cursor: pointer; opacity: .25; pointer-events: none; transition: opacity .3s; }
  .gate button.ready { opacity: 1; pointer-events: auto; }
  .gate p { color: var(--dim); font-size: 12px; margin: 14px 0 0; }
  .touch { display: none; }
  .cmd { display: none; position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); font: inherit; font-size: 16px; color: var(--ink); background: var(--panel); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 8px; padding: 10px 12px; pointer-events: auto; }
  .cmd:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (pointer: coarse) {
    .keys { display: none; }
    .touch { display: flex; position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: center; width: calc(100% - 32px); }
    .prompt { top: auto; bottom: 74px; }
    .at-desk .cmd { display: block; }
    .at-desk .prompt { display: none; }
  }
  @media (max-width: 560px) {
    .tag .long { display: none; }
    .corner { top: calc(44px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); flex-wrap: wrap; }
    .stats { top: calc(124px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); right: auto; text-align: left; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="hud">
  <div class="tag"><b>BEHBOD</b> · LOFT<span class="long"> · FEEL SLICE</span></div>
  <div class="corner"><button class="chip" id="who">Head: hood</button><button class="chip" id="q">Quality: auto</button><button class="chip" id="snd">Sound off</button></div>
  <div class="stats" id="stats"></div>
  <input id="cmd" class="cmd" type="text" enterkeyhint="send" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type a command, like help" aria-label="Terminal command">
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="prompt" id="prompt"><b>E</b>Use computer</div>
  <div class="keys"><span><b>WASD</b>move</span><span><b>Shift</b>run</span><span><b>Space</b>jump</span><span><b>Drag</b>look</span><span><b>E</b>use</span><span><b>C</b>crouch, tap twice to roll</span><span><b>H</b>head</span><span><b>Click</b>walk there</span><span><b>Esc</b>back</span></div>
  <div class="touch"><button class="chip" data-go="desk">Desk</button><button class="chip" data-go="window">Window</button><button class="chip" data-go="lounge">Lounge</button><button class="chip" id="use">Use</button></div>
</div>
<div class="gate" id="gate"><div class="box"><h1>BEHBOD · LOFT</h1><div class="bar"><i id="bar"></i></div><button id="enter">Enter</button><p id="note">Loading the loft</p></div></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.36.4/build/index.js"
} }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
